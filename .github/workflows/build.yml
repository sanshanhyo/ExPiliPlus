name: Build ExPiliplus

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            build_ios:
                description: "Build iOS"
                required: false
                default: true
                type: boolean

            build_mac:
                description: "Build Mac"
                required: false
                default: true
                type: boolean

            build_win_x64:
                description: "Build Win-x64"
                required: false
                default: true
                type: boolean

            build_linux_x64:
                description: "Build Linux-x64"
                required: false
                default: true
                type: boolean

            tag:
                description: "Release tag, e.g. v1.0.0 or v1.0.0-dev.1"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply Patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Configure Android signing
              if: ${{ github.event_name == 'workflow_dispatch' }}
              env:
                  SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  if [ -z "$SIGN_KEYSTORE_BASE64" ] &&
                    [ -z "$KEYSTORE_PASSWORD" ] &&
                    [ -z "$KEY_ALIAS" ] &&
                    [ -z "$KEY_PASSWORD" ]; then
                    echo "::notice::Android release keystore is not configured; using the debug signing fallback"
                    exit 0
                  fi
                  if {
                    [ -z "$SIGN_KEYSTORE_BASE64" ] ||
                    [ -z "$KEYSTORE_PASSWORD" ] ||
                    [ -z "$KEY_ALIAS" ] ||
                    [ -z "$KEY_PASSWORD" ]
                  }; then
                    echo "::error::Android signing secrets must either all be configured or all be empty"
                    exit 1
                  fi
                  echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
                  printf "storeFile=key.jks\n" >> android/key.properties
                  printf "storePassword=%s\n" "$KEYSTORE_PASSWORD" >> android/key.properties
                  printf "keyAlias=%s\n" "$KEY_ALIAS" >> android/key.properties
                  printf "keyPassword=%s\n" "$KEY_PASSWORD" >> android/key.properties

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 -Platform android -Tag "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}"

            - name: Flutter Build Release Apk
              if: ${{ github.event_name == 'workflow_dispatch' }}
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

            - name: Flutter Build Dev Apk
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                  flutter build apk --release --split-per-abi --android-project-arg dev=1 --dart-define-from-file=pili_release.json --pub

            - name: Rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "ExPiliplus_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  prerelease: ${{ fromJSON(env.is_prerelease) }}
                  make_latest: ${{ env.is_prerelease == 'true' && 'false' || 'true' }}
                  files: ExPiliplus_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: ExPiliplus_Android_arm64-v8a
                  path: ExPiliplus_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: ExPiliplus_Android_armeabi-v7a
                  path: ExPiliplus_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: ExPiliplus_Android_x86_64
                  path: ExPiliplus_android_*_x86_64.apk

    ios:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_ios == 'true' }}
        uses: ./.github/workflows/ios.yml
        permissions:
            contents: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mac:
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_mac == 'true' }}
        uses: ./.github/workflows/mac.yml
        permissions:
            contents: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    win_x64:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_win_x64 == 'true' }}
        uses: ./.github/workflows/win_x64.yml
        permissions:
            contents: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    linux_x64:
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux_x64 == 'true' }}
        uses: ./.github/workflows/linux_x64.yml
        permissions:
            contents: write
        with:
            tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

    mirror_lanzou:
        name: Mirror Release to Lanzou
        needs:
            - android
            - ios
            - mac
            - win_x64
            - linux_x64
        if: >-
            ${{
                always() &&
                github.event_name == 'workflow_dispatch' &&
                github.event.inputs.tag != '' &&
                !contains(needs.*.result, 'failure') &&
                !contains(needs.*.result, 'cancelled')
            }}
        uses: ./.github/workflows/mirror_lanzou.yml
        permissions:
            contents: write
        with:
            tag: ${{ github.event.inputs.tag }}
        secrets: inherit
