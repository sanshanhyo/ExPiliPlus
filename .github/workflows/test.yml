name: Test ExPiliplus

on:
  push:
    branches:
      - main
      - feat/aicu-comment-lookup
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format generated localizations
        run: dart format lib/l10n/generated

      - name: Check generated localizations
        run: git diff --exit-code -- lib/l10n/generated

      - name: Check diff whitespace
        run: git diff --check

      - name: Analyze
        # The synced tree currently has known warning/info diagnostics. Keep
        # them visible without preventing the test job; analyzer errors remain
        # fatal by default.
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Prepare licensed CJK font for rendered test captures
        run: |
          mkdir -p build/test-fonts
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            https://raw.githubusercontent.com/adobe-fonts/source-han-serif/2.003R/SubsetOTF/CN/SourceHanSerifCN-Regular.otf \
            --output build/test-fonts/SourceHanSerifCN-Regular.otf
          echo '3754ea669c530e2473354f8f6d9f79680a44d7e26ec7d00eeabee4a7e0753c5d  build/test-fonts/SourceHanSerifCN-Regular.otf' | sha256sum --check -

      - name: Test
        run: flutter test --no-pub

      - name: Upload rendered AICU UI captures
        if: always() && github.ref == 'refs/heads/feat/aicu-comment-lookup'
        uses: actions/upload-artifact@v7
        with:
          name: aicu-rendered-ui-${{ github.run_id }}
          path: build/test-artifacts/aicu/
          if-no-files-found: warn
          retention-days: 14

  android-real-webview:
    if: github.ref == 'refs/heads/feat/aicu-comment-lookup'
    name: Android real AICU WebView
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 Android

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check generated localizations
        run: git diff --exit-code -- lib/l10n/generated

      - name: Enable KVM for the ephemeral Android runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo 'KVM is unavailable to the ephemeral runner; refusing software emulation.'
            id
            ls -l /dev/kvm || true
            exit 1
          fi

      - name: Run the real AICU page in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 35 produced a system-phone ANR during the WebView run. Retest
          # the real page on API 34 to separate emulator-image instability from
          # app/WebView behavior.
          api-level: 34
          arch: x86_64
          # The renderer was killed or crashed while loading the full site;
          # give Chromium more headroom and retain logcat diagnostics.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          # KVM must be active; don't silently fall back to software x86_64.
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash .github/scripts/run_aicu_real_webview_android.sh

      - name: Require a captured real WebView screenshot
        if: success()
        run: test -s build/test-artifacts/aicu-real-webview/uid-2-android-webview.png

      - name: Upload real Android WebView capture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aicu-real-android-webview-${{ github.run_id }}
          path: build/test-artifacts/aicu-real-webview/
          if-no-files-found: warn
          retention-days: 14
