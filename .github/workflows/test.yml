name: Test ExPiliplus

on:
  push:
    branches:
      - main
      - upstream-2.1.4-sync
      - sync/upstream-2.1.6.2
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check generated localizations
        run: git diff --exit-code -- lib/l10n/generated

      - name: Check diff whitespace
        run: git diff --check

      - name: Analyze
        # The synced tree currently has known warning/info diagnostics. Keep
        # them visible without preventing the test job; analyzer errors remain
        # fatal by default.
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Install Linux native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Test
        run: flutter test --no-pub
