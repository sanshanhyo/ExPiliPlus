name: Build ExPiliPlus for Windows x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.1.0"
        required: false
        default: ""
        type: string

jobs:
  build-windows-app:
    name: Release Windows x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Add fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup

      - name: Add Chinese language file for Inno Setup
        run: |
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Build Windows
        run: |
          fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json"

      - name: Prepare Upload
        run: |
          mkdir -p Release/ExPiliPlus-Win
          mkdir -p ExPiliPlus-Win-Setup
          mv build/windows/x64/runner/Release/* Release/ExPiliPlus-Win/
          mv dist/**/*.exe ExPiliPlus-Win-Setup/ExPiliPlus_windows_${{ env.version }}_x64_setup.exe

      - name: Compress
        run: |
          Compress-Archive -Path "Release/ExPiliPlus-Win" -DestinationPath "ExPiliPlus_windows_${{ env.version }}_x64_portable.zip"
        shell: pwsh

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            ExPiliPlus_windows_*.zip
            ExPiliPlus-Win-Setup/ExPiliPlus_windows_*.exe

      - name: Upload windows file release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliPlus_Windows_file_x64_release
          path: ExPiliPlus_windows_*.zip

      - name: Upload windows setup release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliPlus_Windows_setup_x64_release
          path: ExPiliPlus-Win-Setup/ExPiliPlus_windows_*.exe
