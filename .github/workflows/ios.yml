name: Build ExPiliplus for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.1.0-ex.1"
        required: false
        default: ""
        type: string

jobs:
  build-macos-app:
    name: Release IOS
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json
          rm -rf Payload
          mkdir -p Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          # Keep the unsigned payload structurally valid for downstream IPA resigning tools.
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --timestamp=none --preserve-metadata=identifier,entitlements {} \;
          codesign --force --sign - --timestamp=none --preserve-metadata=identifier,entitlements Payload/Runner.app
          codesign --verify --deep --strict --verbose=2 Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent Payload ExPiliplus_ios_${{ env.version }}.ipa

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          files: |
            ExPiliplus_ios_*.ipa

      - name: Upload ios release
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliplus_iOS_release
          path: ExPiliplus_ios_*.ipa
