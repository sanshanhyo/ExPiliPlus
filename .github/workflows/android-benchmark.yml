name: Android package and GIF benchmark

on:
  push:
    branches:
      - refactor/shutdown-timer-ui

permissions:
  contents: read

concurrency:
  group: android-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Build temporary filter-enabled Android GIF libraries
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Restore the pinned Android GIF artifact cache
        id: native-artifact-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/android-gif-native-artifacts.tar.gz
          key: android-gif-native-v1-${{ hashFiles('pubspec.yaml', 'pubspec.lock', 'lib/scripts/build_android_gif_libmpv.sh', 'lib/scripts/enable_android_gif_filters.py', 'lib/scripts/build_android_event_loop_compat.sh', 'third_party/android-gif-libmpv/**') }}

      - name: Setup Java for Android SDK tools
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter for Android library packaging
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve Flutter dependencies for the media_kit FFI contract
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Verify restored pinned native GIF artifacts
        if: steps.native-artifact-cache.outputs.cache-hit == 'true'
        run: |
          test -s "$RUNNER_TEMP/android-gif-native-artifacts.tar.gz"
          tar -xzf "$RUNNER_TEMP/android-gif-native-artifacts.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check android-gif-native-artifacts.sha256
          grep -Fxq 'source_commit=0bb77586769b9e882123197ef8dc940bae5de8b2' \
            android-gif-libmpv-base/build-metadata.txt
          grep -Fxq 'fps_filter=enabled' android-gif-libmpv-base/build-metadata.txt
          grep -Fxq 'scale_filter=enabled' android-gif-libmpv-base/build-metadata.txt
          grep -Fxq 'media_kit_native_event_loop_source_commit=73771ec38176be2d984a3049c28177bce23b54a0' \
            android-gif-event-loop-artifacts/build-metadata.txt
          grep -Fxq 'media_kit_native_event_loop_ndk_version=28.2.13676358' \
            android-gif-event-loop-artifacts/build-metadata.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "android-gif-libmpv-base/default-${abi}.jar"
            test -s "android-gif-event-loop-artifacts/default-${abi}.jar"
          done
          echo "reused_native_artifact_cache_key=${{ steps.native-artifact-cache.outputs.cache-primary-key }}"

      - name: Check native builder contracts
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m unittest discover -s .github/scripts -p 'android_emulator_script_check_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_benchmark_script_check_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_event_loop_builder_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_gif_common_lifecycle_fix_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_event_loop_artifact_stage_unit_tests.py' -v
          python3 .github/scripts/check_android_emulator_scripts.py

      - name: Install Android GIF native build tools
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        run: |
          if timeout --signal=TERM --kill-after=30s 5m sudo apt-get update; then
            :
          else
            status=$?
            echo "apt-get update failed or timed out (status $status)" >&2
            exit "$status"
          fi
          if timeout --signal=TERM --kill-after=30s 5m sudo apt-get install --no-install-recommends -y \
            autoconf pkg-config libtool ninja-build nasm unzip python3-pip python3-venv; then
            :
          else
            status=$?
            echo "native package installation failed or timed out (status $status)" >&2
            exit "$status"
          fi
          python3 -m venv "$RUNNER_TEMP/android-gif-build-venv"
          if timeout --signal=TERM --kill-after=30s 4m \
            "$RUNNER_TEMP/android-gif-build-venv/bin/pip" install --no-input \
              --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 2 \
              meson jsonschema jinja2; then
            :
          else
            status=$?
            echo "native Python build-tool installation failed or timed out (status $status)" >&2
            exit "$status"
          fi
          {
            echo "python=$(python3 --version 2>&1)"
            echo "pip=$($RUNNER_TEMP/android-gif-build-venv/bin/pip --version)"
            "$RUNNER_TEMP/android-gif-build-venv/bin/pip" freeze
            dpkg-query -W -f='${Package}=${Version}\n' \
              autoconf pkg-config libtool ninja-build nasm unzip python3-pip python3-venv
          } > "$RUNNER_TEMP/android-gif-build-toolchain.txt"
          echo "$RUNNER_TEMP/android-gif-build-venv/bin" >> "$GITHUB_PATH"

      - name: Rebuild pinned filter-enabled GIF libmpv for all Android ABIs
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          sdkmanager=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/tools/bin/sdkmanager" \
            "$sdk_root"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              sdkmanager="$candidate"
              break
            fi
          done
          if [ -z "$sdkmanager" ]; then
            echo "Refusing the upstream command-line-tools bootstrap: hosted Android SDK is unavailable at $sdk_root" >&2
            exit 1
          fi
          echo "using_existing_sdkmanager=$sdkmanager"
          timeout --signal=TERM --kill-after=60s 100m \
            bash lib/scripts/build_android_gif_libmpv.sh \
              "$RUNNER_TEMP/android-gif-libmpv-base"

      - name: Stage the locked media_kit callback into the rebuilt JARs
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        run: |
          bash lib/scripts/build_android_event_loop_compat.sh \
            "$RUNNER_TEMP/android-gif-event-loop-artifacts" \
            "$RUNNER_TEMP/android-event-loop-evidence" \
            "$RUNNER_TEMP/android-gif-libmpv-base"

      - name: Package and hash the temporary native artifacts
        if: steps.native-artifact-cache.outputs.cache-hit != 'true'
        run: |
          cd "$RUNNER_TEMP"
          sha256sum \
            android-gif-libmpv-base/default-*.jar \
            android-gif-libmpv-base/build-metadata.txt \
            android-gif-event-loop-artifacts/default-*.jar \
            android-gif-event-loop-artifacts/build-metadata.txt \
            > android-gif-native-artifacts.sha256
          tar -czf android-gif-native-artifacts.tar.gz \
            android-gif-libmpv-base \
            android-gif-event-loop-artifacts \
            android-event-loop-evidence \
            android-gif-build-toolchain.txt \
            android-gif-native-artifacts.sha256

      - name: Report GIF before-and-after scope
        run: |
          echo "Benchmark baseline identity: exact measured-before source 85415402420eaabeae08fb33e496d3eaced232cc; no source patch."
          echo "Only the full GIF parse before END_FILE teardown is removed in the candidate."
          {
            echo '### GIF before-and-after benchmark'
            echo
            echo '- Baseline: exact source `85415402420eaabeae08fb33e496d3eaced232cc`; no temporary source patch.'
            echo '- Candidate: current workflow head; same deferred teardown, final GIF validator, dependencies, and staged native JAR hashes.'
            echo '- Comparison scope: remove only the synchronous full GIF read/parse inside END_FILE before deferred teardown.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload temporary native artifacts for downstream validation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-gif-native-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/android-gif-native-artifacts.tar.gz
          if-no-files-found: error
          retention-days: 5

      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-gif-native-build-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-gif-libmpv-base/build.log
            ${{ runner.temp }}/android-gif-libmpv-base/build-metadata.txt
            ${{ runner.temp }}/android-gif-build-toolchain.txt
            ${{ runner.temp }}/android-event-loop-evidence/**
          if-no-files-found: ignore
          retention-days: 5

  app-integration:
    name: Run Android app and GIF export validation
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Download temporary native artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-gif-native-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/android-gif-native-download

      - name: Verify and unpack temporary native artifacts
        run: |
          tar -xzf "$RUNNER_TEMP/android-gif-native-download/android-gif-native-artifacts.tar.gz" \
            -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check android-gif-native-artifacts.sha256
          grep -Fxq 'fps_filter=enabled' android-gif-event-loop-artifacts/build-metadata.txt
          grep -Fxq 'scale_filter=enabled' android-gif-event-loop-artifacts/build-metadata.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "android-gif-libmpv-base/default-${abi}.jar"
            test -s "android-gif-event-loop-artifacts/default-${abi}.jar"
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Apply Android Flutter patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Android

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check generated localizations and whitespace
        run: |
          git diff --exit-code -- lib/l10n/generated
          git diff --check

      - name: Install pinned Pillow decoder for app GIF verification
        run: |
          python3 -m venv "$RUNNER_TEMP/android-app-gif-venv"
          timeout --signal=TERM --kill-after=15s 4m \
            "$RUNNER_TEMP/android-app-gif-venv/bin/pip" install --no-input \
              --disable-pip-version-check --only-binary=:all: --timeout 20 --retries 2 \
              Pillow==12.3.0
          "$RUNNER_TEMP/android-app-gif-venv/bin/python" -c \
            'import PIL; print(f"Pillow {PIL.__version__}"); assert PIL.__version__ == "12.3.0"'
          echo "$RUNNER_TEMP/android-app-gif-venv/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable" >&2
            exit 1
          fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run app playback, timer, and real GIF export on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MEDIA_KIT_ANDROID_VIDEO_ARTIFACT_DIR: ${{ runner.temp }}/android-gif-event-loop-artifacts
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run_android_app_gif_validation.sh "${{ runner.temp }}/android-app-gif-validation"

      - name: Upload Android app and GIF verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-app-gif-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-app-gif-validation/emulator-screen.png
            ${{ runner.temp }}/android-app-gif-validation/android-logcat.txt
            ${{ runner.temp }}/android-app-gif-validation/countdown_quick_bar.png
            ${{ runner.temp }}/android-app-gif-validation/countdown_outside_tile.png
            ${{ runner.temp }}/android-app-gif-validation/integration-step.log
            ${{ runner.temp }}/android-app-gif-validation/gif-validation.log
            ${{ runner.temp }}/android-app-gif-validation/gif-probe.json
            ${{ runner.temp }}/android-app-gif-validation/export-gif.sha256
            ${{ runner.temp }}/android-app-gif-validation/validation-status.txt
          if-no-files-found: ignore
          retention-days: 14

  compare:
    name: Compare APK size and synthetic-video GIF performance
    needs: [native, app-integration]
    if: ${{ always() && needs.native.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout candidate and baseline history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download temporary native artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-gif-native-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/android-gif-native-download

      - name: Verify and unpack temporary native artifacts
        run: |
          tar -xzf "$RUNNER_TEMP/android-gif-native-download/android-gif-native-artifacts.tar.gz" \
            -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum --check android-gif-native-artifacts.sha256
          grep -Fxq 'fps_filter=enabled' android-gif-event-loop-artifacts/build-metadata.txt
          grep -Fxq 'scale_filter=enabled' android-gif-event-loop-artifacts/build-metadata.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "android-gif-libmpv-base/default-${abi}.jar"
            test -s "android-gif-event-loop-artifacts/default-${abi}.jar"
          done

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Verify flutter drive options before emulator setup
        run: |
          python3 .github/scripts/check_android_benchmark_cli.py \
            --help-output "${RUNNER_TEMP}/android-benchmark/toolchain/flutter-drive-help.txt"

      - name: Prepare pinned Pillow GIF decoder
        run: |
          if ! python3 -c 'import PIL; assert PIL.__version__ == "12.3.0"' 2>/dev/null; then
            timeout --signal=TERM --kill-after=15s 4m \
              python3 -m pip install --user --no-input --disable-pip-version-check \
                --only-binary=:all: --timeout 20 --retries 2 Pillow==12.3.0
          fi
          python3 -c 'import PIL; print(f"Pillow {PIL.__version__}"); assert PIL.__version__ == "12.3.0"'
          python3 -m unittest discover -s .github/scripts -p 'android_gif_validation_unit_tests.py' -v

      - name: Check Android emulator and benchmark scripts
        run: |
          python3 -m unittest discover -s .github/scripts -p 'android_emulator_script_check_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_benchmark_lock_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_benchmark_script_check_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_benchmark_cli_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'media_kit_event_loop_contract_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_event_loop_artifact_stage_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_event_loop_builder_unit_tests.py' -v
          python3 -m unittest discover -s .github/scripts -p 'android_gif_common_lifecycle_fix_unit_tests.py' -v
          python3 .github/scripts/check_android_emulator_scripts.py

      - name: Compile injected GIF benchmark targets before APK builds
        run: |
          fixture="$RUNNER_TEMP/android-benchmark-preflight-source.mp4"
          video_data="$RUNNER_TEMP/android_benchmark_video_data.dart"
          (cd .github/benchmarks/fixtures && sha256sum --check SHA256SUMS)
          cp .github/benchmarks/fixtures/android-benchmark-source.mp4 "$fixture"
          python3 .github/scripts/embed_android_benchmark_video.py \
            "$fixture" "$video_data"
          bash .github/scripts/check_android_benchmark_harness.sh \
            "${{ github.sha }}" "$video_data" \
            "$RUNNER_TEMP/android-benchmark-harness-preflight" \
            "$RUNNER_TEMP/android-gif-event-loop-artifacts" \
            85415402420eaabeae08fb33e496d3eaced232cc

      - name: Verify KVM for the ephemeral Android runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable" >&2
            exit 1
          fi
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Build matched APKs and benchmark synthetic GIF conversion
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MEDIA_KIT_ANDROID_VIDEO_ARTIFACT_DIR: ${{ runner.temp }}/android-gif-event-loop-artifacts
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run_android_benchmark.sh 85415402420eaabeae08fb33e496d3eaced232cc "${{ github.sha }}" "${{ runner.temp }}/android-benchmark"

      - name: Upload Android package and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-gif-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/android-benchmark/
          if-no-files-found: ignore
          retention-days: 14
