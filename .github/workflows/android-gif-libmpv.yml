name: Build Android GIF libmpv

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Build three ABI GIF libmpv JARs
        runs-on: ubuntu-22.04
        timeout-minutes: 45

        steps:
            - name: Checkout ExPiliPlus
              uses: actions/checkout@v7

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"
                  cache: gradle

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version-file: pubspec.yaml
                  channel: stable
                  cache: true

            - name: Install native build tools
              run: |
                  sudo apt-get update
                  sudo apt-get install -y autoconf pkg-config libtool ninja-build nasm unzip python3-pip python3-setuptools
                  python3 -m pip install --user meson jsonschema jinja2
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Build pinned GIF libmpv artifacts
              run: |
                  chmod +x lib/scripts/build_android_gif_libmpv.sh
                  timeout --foreground --signal=TERM --kill-after=60s 1800s \
                    lib/scripts/build_android_gif_libmpv.sh build/android-gif-libmpv

            - name: Validate APK native integration
              env:
                  MEDIA_KIT_ANDROID_VIDEO_ARTIFACT_DIR: ${{ github.workspace }}/build/android-gif-libmpv
              run: |
                  for abi in arm64-v8a armeabi-v7a x86_64; do
                      jar="build/android-gif-libmpv/default-${abi}.jar"
                      so_file="$RUNNER_TEMP/${abi}.jar.libmpv.so"
                      strings_file="$RUNNER_TEMP/${abi}.jar.strings"
                      unzip -p "$jar" "lib/${abi}/libmpv.so" > "$so_file"
                      if [ ! -s "$so_file" ]; then
                          echo "missing libmpv.so in $jar"
                          unzip -l "$jar"
                          exit 1
                      fi
                      strings -a "$so_file" > "$strings_file"
                      if ! grep -F 'ff_gif_encoder' "$strings_file" >/dev/null; then
                          echo "missing ff_gif_encoder in $jar"
                          file "$so_file"
                          wc -c "$so_file"
                          exit 1
                      fi
                      if ! grep -F 'ff_gif_muxer' "$strings_file" >/dev/null; then
                          echo "missing ff_gif_muxer in $jar"
                          exit 1
                      fi
                      if grep -Ei 'ff_libx264|--enable-libx264|libx264-lossless' "$strings_file" >/dev/null; then
                          echo "GIF-only JAR contains x264 symbols: $jar"
                          exit 1
                      fi
                      echo "jar_symbols_verified=$abi"
                  done
                  if [ ! -s build/android-gif-libmpv/source-license.txt ] || [ ! -s build/android-gif-libmpv/licenses.txt ]; then
                      echo "license metadata is missing or empty"
                      ls -la build/android-gif-libmpv
                      exit 1
                  fi
                  echo "license_metadata_verified"
                  echo "validation_phase=flutter_pub_get"
                  flutter pub get
                  echo "validation_phase=flutter_build_apk"
                  flutter build apk --debug --target-platform android-arm64,android-arm,android-x64
                  echo "validation_phase=flutter_build_apk_complete"

            - name: Validate GIF symbols in APK
              run: |
                  apk="build/app/outputs/flutter-apk/app-debug.apk"
                  for abi in arm64-v8a armeabi-v7a x86_64; do
                      so_file="$RUNNER_TEMP/${abi}.apk.libmpv.so"
                      strings_file="$RUNNER_TEMP/${abi}.apk.strings"
                      unzip -p "$apk" "lib/${abi}/libmpv.so" > "$so_file"
                      if [ ! -s "$so_file" ]; then
                          echo "missing libmpv.so in APK ABI $abi"
                          unzip -l "$apk" | grep "lib/${abi}/"
                          exit 1
                      fi
                      strings -a "$so_file" > "$strings_file"
                      if ! grep -F 'ff_gif_encoder' "$strings_file" >/dev/null; then
                          echo "missing ff_gif_encoder in APK ABI $abi"
                          exit 1
                      fi
                      if ! grep -F 'ff_gif_muxer' "$strings_file" >/dev/null; then
                          echo "missing ff_gif_muxer in APK ABI $abi"
                          exit 1
                      fi
                      echo "apk_symbols_verified=$abi"
                  done

            - name: Upload artifacts and audit metadata
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: ExPiliPlus_android_gif_libmpv
                  path: |
                      build/android-gif-libmpv/default-*.jar
                      build/android-gif-libmpv/build-metadata.txt
                      build/android-gif-libmpv/build.log
                      build/android-gif-libmpv/licenses.txt
                      build/android-gif-libmpv/source-license.txt
                      build/android-gif-libmpv/licenses/**
                      build/app/outputs/flutter-apk/*.apk
