name: Build ExPiliplus for Linux x64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0 or v1.0.0-dev.1"
        required: false
        default: ""
        type: string

jobs:
  build-linux-app:
    name: Release Linux x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev
        shell: bash

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 -Platform linux -Tag "${{ inputs.tag }}"

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

        #TODO: deb and rpm packages need to be build
      - name: Build Linux
        run: flutter build linux --release -v --pub --dart-define-from-file=pili_release.json

      - name: Package .tar.gz
        run: tar -zcvf ExPiliplus_linux_${{ env.version }}_amd64.tar.gz -C build/linux/x64/release/bundle .

      - name: Packege deb
        run: |
          printf "建立构建目录...\n"
          mkdir "ExPiliplus_linux_${{ env.version }}_amd64"
          pushd "ExPiliplus_linux_${{ env.version }}_amd64"
          mkdir -p opt/ExPiliplus
          mkdir -p usr/bin
          mkdir -p usr/share/applications
          mkdir -p usr/share/icons/hicolor/512x512/apps

          printf "复制文件...\n"
          cp -r ../build/linux/x64/release/bundle/* opt/ExPiliplus
          cp -r ../assets/linux/DEBIAN .
          ln -sf /opt/ExPiliplus/expiliplus usr/bin/expiliplus
          cp ../assets/linux/expiliplus.desktop usr/share/applications
          cp ../assets/images/logo/logo.png usr/share/icons/hicolor/512x512/apps/expiliplus.png

          printf "修改控制文件...\n"
          # Debian uses "~" so development builds sort before their stable build.
          DEB_VERSION="${{ env.version }}"
          DEB_VERSION="${DEB_VERSION/-/~}"
          sed -i "2s/version_need_change/${DEB_VERSION}/g" DEBIAN/control
          # 计算安装大小并替换
          SIZE_KB=$(du -s -b --apparent-size . | awk '{print int($1)}')
          SIZE_KB=$(($SIZE_KB - $(du -s -b --apparent-size DEBIAN | awk '{print int($1)}')))
          SIZE_KB=$(echo $SIZE_KB | awk '{print int($1/1024 + 0.999)}')
          printf "\t安装大小: %s KB\n" "$SIZE_KB"
          sed -i "9s/size_need_change/${SIZE_KB}/g" DEBIAN/control

          printf "生成并写入 md5sums ...\n"
          md5sum opt/ExPiliplus/expiliplus >> DEBIAN/md5sums
          md5sum opt/ExPiliplus/lib/* >> DEBIAN/md5sums
          md5sum opt/ExPiliplus/data/icudtl.dat >> DEBIAN/md5sums

          printf "设置权限...\n"
          chmod 0644 DEBIAN/control
          chmod 0644 DEBIAN/md5sums
          chmod 0755 DEBIAN/postinst
          chmod 0755 DEBIAN/postrm
          chmod 0755 DEBIAN/prerm

          printf "打包 deb 文件...\n"
          popd
          dpkg-deb --build --verbose --root-owner-group "ExPiliplus_linux_${{ env.version }}_amd64"
          printf "完成: ExPiliplus_linux_%s_amd64.deb\n" "${{ env.version }}"
        shell: bash

      - name: Packege rpm
        run: |
          printf "建立 RPM 构建目录...\n"
          RPM_BUILD_ROOT="$PWD/rpm_build"
          mkdir -p "$RPM_BUILD_ROOT/BUILD" "$RPM_BUILD_ROOT/RPMS" "$RPM_BUILD_ROOT/SOURCES" "$RPM_BUILD_ROOT/SPECS" "$RPM_BUILD_ROOT/SRPMS"

          printf "准备源码归档（仅包含运行时与元数据）...\n"
          DATE="$(date '+%a %b %d %Y')"
          SRC_DIR="$PWD/expiliplus-${{ env.version }}"
          mkdir -p "$SRC_DIR/bundle" "$SRC_DIR/assets"
          cp -r build/linux/x64/release/bundle/* "$SRC_DIR/bundle/"
          cp assets/linux/expiliplus.desktop "$SRC_DIR/assets/expiliplus.desktop"
          cp assets/images/logo/logo.png "$SRC_DIR/assets/expiliplus.png"
          tar -zcvf "$RPM_BUILD_ROOT/SOURCES/expiliplus-${{ env.version }}.tar.gz" -C "$PWD" "expiliplus-${{ env.version }}"

          # RPM development releases use Release 0.* so they sort before the
          # stable Release 1 package with the same Version.
          RPM_DISPLAY_VERSION="${{ env.version }}"
          RPM_BUILD_METADATA=""
          if [[ "$RPM_DISPLAY_VERSION" == *"+"* ]]; then
            RPM_BUILD_METADATA="${RPM_DISPLAY_VERSION#*+}"
            RPM_DISPLAY_VERSION="${RPM_DISPLAY_VERSION%%+*}"
          fi
          RPM_VERSION="${RPM_DISPLAY_VERSION%%-*}"
          if [[ "$RPM_DISPLAY_VERSION" == *"-"* ]]; then
            RPM_RELEASE="0.${RPM_DISPLAY_VERSION#*-}"
          else
            RPM_RELEASE="1"
          fi
          if [ -n "$RPM_BUILD_METADATA" ]; then
            RPM_RELEASE="${RPM_RELEASE}.${RPM_BUILD_METADATA}"
          fi

          printf "生成 spec 文件...\n"
          cat > "$RPM_BUILD_ROOT/SPECS/expiliplus.spec" <<EOF
          Name:           expiliplus
          Version:        ${RPM_VERSION}
          Release:        ${RPM_RELEASE}%{?dist}
          Summary:        ExPiliplus Linux Version
          License:        GPL-3.0
          Source0:        expiliplus-${{ env.version }}.tar.gz
          Requires:       desktop-file-utils, hicolor-icon-theme

          %description
          ExPiliplus, an unofficial Flutter client based on PiliPlus

          %prep
          %setup -q -n expiliplus-${{ env.version }}

          %build

          %install
          mkdir -p %{buildroot}/opt/ExPiliplus
          cp -r bundle/* %{buildroot}/opt/ExPiliplus/

          # 二进制权限与命令行入口
          chmod 755 %{buildroot}/opt/ExPiliplus/expiliplus
          mkdir -p %{buildroot}/usr/bin
          ln -sf /opt/ExPiliplus/expiliplus %{buildroot}/usr/bin/expiliplus

          # 桌面集成
          mkdir -p %{buildroot}/usr/share/applications
          install -m 644 assets/expiliplus.desktop %{buildroot}/usr/share/applications/expiliplus.desktop

          mkdir -p %{buildroot}/usr/share/icons/hicolor/512x512/apps
          install -m 644 assets/expiliplus.png %{buildroot}/usr/share/icons/hicolor/512x512/apps/expiliplus.png

          %post
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %postun
          update-desktop-database -q || true
          gtk-update-icon-cache -q -t -f %{_datadir}/icons/hicolor || true

          %files
          /opt/ExPiliplus
          /usr/bin/expiliplus
          /usr/share/applications/expiliplus.desktop
          /usr/share/icons/hicolor/512x512/apps/expiliplus.png

          %changelog
          * DATE - ${RPM_VERSION}-${RPM_RELEASE}
          - Initial RPM release
          EOF

          sed -i "s/DATE/${DATE}/g" "$RPM_BUILD_ROOT/SPECS/expiliplus.spec"

          printf "构建 RPM 包...\n"
          rpmbuild --define "_topdir $RPM_BUILD_ROOT" -bb "$RPM_BUILD_ROOT/SPECS/expiliplus.spec"

          printf "移动生成的 RPM...\n"
          find "$RPM_BUILD_ROOT/RPMS" -name "*.rpm" -exec mv {} "ExPiliplus_linux_${{ env.version }}_amd64.rpm" \;

          printf "完成: ExPiliplus_linux_%s_amd64.rpm\n" "${{ env.version }}"
        shell: bash

      - name: Package AppImage
        run: |
          printf "下载 appimagetool...\n"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          printf "建立 AppDir 目录结构...\n"
          APPDIR="ExPiliplus.AppDir"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/lib"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          printf "复制应用文件...\n"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"
          chmod +x "$APPDIR/usr/bin/expiliplus"

          printf "复制桌面文件和图标...\n"
          cp assets/linux/expiliplus.desktop "$APPDIR/expiliplus.desktop"
          cp assets/linux/expiliplus.desktop "$APPDIR/usr/share/applications/expiliplus.desktop"
          cp assets/images/logo/logo.png "$APPDIR/expiliplus.png"
          cp assets/images/logo/logo.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/expiliplus.png"

          printf "创建 AppRun 启动脚本...\n"
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/expiliplus" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"

          printf "打包 AppImage...\n"
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" "ExPiliplus_linux_${{ env.version }}_amd64.AppImage"

          printf "完成: ExPiliplus_linux_%s_amd64.AppImage\n" "${{ env.version }}"
        shell: bash

      - name: Release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          prerelease: ${{ fromJSON(env.is_prerelease) }}
          make_latest: ${{ env.is_prerelease == 'true' && 'false' || 'true' }}
          files: |
            ExPiliplus_linux_*.tar.gz
            ExPiliplus_linux_*.deb
            ExPiliplus_linux_*.rpm
            ExPiliplus_linux_*.AppImage

      - name: Upload linux targz package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliplus_Linux_targz_amd64_package
          path: ExPiliplus_linux_*.tar.gz

      - name: Upload linux deb package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliplus_Linux_deb_amd64_package
          path: ExPiliplus_linux_*.deb

      - name: Upload linux rpm package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliplus_Linux_rpm_amd64_package
          path: ExPiliplus_linux_*.rpm

      - name: Upload linux AppImage package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: ExPiliplus_Linux_AppImage_amd64_package
          path: ExPiliplus_linux_*.AppImage
